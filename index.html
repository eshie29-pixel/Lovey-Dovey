<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovey-Dovey 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
    }

    .heart {
      font-size: 70px;
      animation: beat 1s infinite;
      margin-bottom: 15px;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    h1 {
      color: #e91e63;
      font-size: 34px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #e91e63;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background: #d81b60;
    }

    #noBtn {
      background: #eeeeee;
      color: #444;
      position: relative;
    }

    #surprise {
      display: none;
      margin-top: 25px;
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #surprise h2 {
      color: #e91e63;
      margin-bottom: 12px;
    }

    .floating-heart {
      position: absolute;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp 5s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 0.8;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">💗</div>

    <h1>Will You Be Mine?</h1>

    <p>
      I have something very important to ask you...
      Will you stay by my side? 🥺💕
    </p>

    <div class="buttons">
      <button id="yesBtn">YES 💕</button>
      <button id="noBtn">NO 🙈</button>
    </div>

    <div id="surprise">
      <h2>YAYYY! 😭💗</h2>

      <p>
        I knew you would say yes! 🥹💕
        <br><br>
        You just made my whole world brighter.
        <br>
        I love you endlessly. 💖
      </p>
    </div>

  </div>

  <script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const surprise = document.getElementById("surprise");

    yesBtn.addEventListener("click", function () {

      surprise.style.display = "block";

      yesBtn.style.display = "none";
      noBtn.style.display = "none";

      createHearts();
    });

    noBtn.addEventListener("mouseover", function () {

      const x = Math.random() * 200 - 100;
      const y = Math.random() * 150 - 75;

      noBtn.style.transform =
        `translate(${x}px, ${y}px)`;
    });

    function createHearts() {

      for (let i = 0; i < 25; i++) {

        const heart = document.createElement("div");

        heart.classList.add("floating-heart");

        heart.innerHTML = "💗";

        heart.style.left =
          Math.random() * 100 + "vw";

        heart.style.animationDuration =
          (3 + Math.random() * 4) + "s";

        heart.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(heart);
      }
    }

  </script>

</body>
</html>
